name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=documind --cov-report=term-missing
      - name: Generate evaluation corpus
        run: python scripts/generate_invoices.py --count 30 --anomaly-every 10
      - name: Train CPU ranker
        run: |
          python scripts/generate_invoices.py --count 180 --scan-every 0 --seed 17 --output training/generated
          python scripts/train_ranker.py
      - name: Run rules and learned evaluation
        run: |
          python evaluation/evaluate.py --provider rules
          python evaluation/evaluate.py --provider learned
