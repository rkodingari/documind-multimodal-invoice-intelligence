[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-invoice-intelligence"
version = "0.1.0"
description = "Local-first multimodal invoice extraction, validation, and human review"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "pymupdf>=1.24,<2",
  "pillow>=10.4,<12",
  "pytesseract>=0.3.13,<1",
  "streamlit>=1.37,<2",
  "requests>=2.32,<3",
  "python-dateutil>=2.9,<3",
  "scikit-learn>=1.7,<1.8",
  "joblib>=1.5,<1.6",
]

[project.optional-dependencies]
model = ["openai>=1.40,<2"]
ollama = ["ollama>=0.4,<1"]
gpu = ["torch>=2.4,<3", "transformers>=4.50,<6", "accelerate>=1,<2"]
finetune = ["datasets>=3,<5", "seqeval>=1.2,<2"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["documind*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
